name: Test and scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: xpose rules --validate
      - name: Scan working tree
        run: xpose scan . --no-save --format sarif --output report.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xpose-${{ matrix.os }}-${{ matrix.python }}
          path: report.sarif
